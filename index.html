<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CashFlow Calendar</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1 class="title">💰 CashFlow Calendar</h1>

<div class="balance-card">

<p>Current Balance</p>

<h2 id="balance">S$819.35</h2>

<div class="next-card">

<p>Next Bill</p>

<h3 id="nextBillName">Great Eastern</h3>

<p id="nextBillAmount">-S$244.15</p>

<hr>

<p>Balance After Bill</p>

<h2 id="balanceAfterBill">S$575.20</h2>

</div>

</div>

<div class="card">

<h2>Today's Summary</h2>

<div class="summaryRow">
<span>Current Balance</span>
<strong>S$819.35</strong>
</div>

<div class="summaryRow">
<span>Today's Bills</span>
<strong>1</strong>
</div>

<div class="summaryRow">
<span>Remaining</span>
<strong>S$575.20</strong>
</div>

</div>

<div class="card">

<h2>Calendar</h2>

<div id="calendar">

<p style="opacity:.6">
Calendar will appear here in the next update.
</p>

</div>

</div>

</div>

<nav class="bottom-nav">

<div class="nav-btn">

<br>
Home
</div>

<div class="nav-btn">

<br>

</div>

</div>

</div>

</nav>

<script src="app.js"></script>

</body>
</html>
