<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CashFlow Calendar</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1 class="title">💰 CashFlow Calendar</h1>


<div class="balance-card">

<p>Current Balance</p>

<h2 id="balance">
S$819.35
</h2>

<div class="next-card">

<p>Next Bill</p>

<h3 id="nextBillName">
Great Eastern
</h3>

<p id="nextBillAmount">
-S$244.15
</p>

</div>

</div>



<div class="card">

<h2>Calendar</h2>


<div class="calendar-header">

<button id="prevMonth">
←
</button>


<h2 id="monthTitle">
July 2026
</h2>


<button id="nextMonth">
→
</button>

</div>


<div id="calendar"></div>


</div>



<div class="card">

<h2>Add Transaction</h2>


<input id="transactionName" placeholder="Name">


<input id="transactionAmount" placeholder="Amount">


<select id="transactionType">

<option value="expense">
Expense
</option>

<option value="income">
Income
</option>

</select>


<input id="transactionDay" placeholder="Day of month">


<button id="addTransaction">
Add
</button>


</div>


</div>



<nav class="bottom-nav">

<div class="nav-btn">
🏠
<br>
Home
</div>


<div class="nav-btn">
📅
<br>
Calendar
</div>


<div class="add-btn">
+
</div>


<div class="nav-btn">
📊
<br>
Reports
</div>


<div class="nav-btn">
⚙️
<br>
Settings
</div>


</nav>



<script src="app.js"></script>

</body>
</html>
