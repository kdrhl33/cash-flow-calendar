<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashFlow Calendar</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#111827">
</head>

<body>

<header class="header">
    <h1>💰 CashFlow Calendar</h1>
</header>

<div class="container">

    <section class="card balance-card">

        <h2>Current Balance</h2>

        <div id="currentBalance" class="balance">
            S$819.35
        </div>

        <div class="nextBill">

    <p>Next Bill</p>

    <h3 id="nextBillName">
        Great Eastern
    </h3>

    <p id="nextBillAmount">
        -S$244.15
    </p>

    <hr style="margin:12px 0;border:none;border-top:1px solid rgba(255,255,255,0.2);">

    <p>Balance After Bill</p>

    <h2 id="balanceAfterBill">
        S$575.20
    </h2>

</div>

    </section>

    <section class="card">

        <h2>Quick Actions</h2>

        <button id="addExpenseBtn">
            ➕ Add Expense
        </button>

        <button id="viewCalendarBtn">
            📅 Calendar
        </button>

    </section>

    <section class="card">

        <h2>Upcoming Bills</h2>

        <div id="billList">

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
