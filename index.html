<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CashFlow Calendar</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<h1>💰 CashFlow</h1>

<button id="darkToggle">
🌙
</button>

</header>





<section class="balance-card">

<p>Current Balance</p>

<h2 id="balance">
S$0.00
</h2>


<div class="next-bill">

<p>Next Bill</p>

<h3 id="nextBillName">
No bills yet
</h3>

<span id="nextBillAmount">
S$0.00
</span>


<p>Balance After Bill</p>

<strong id="afterBill">
S$0.00
</strong>

</div>

</section>







<section class="card">

<h2>
Set Current Balance
</h2>


<input 
id="startingBalanceInput"
type="number"
placeholder="Example: 1000"
>


<button id="saveBalance">
Save Balance
</button>


</section>








<section class="summary">


<div>

<p>
Income
</p>

<h3 id="incomeTotal">
S$0.00
</h3>

</div>


<div>

<p>
Expenses
</p>

<h3 id="expenseTotal">
S$0.00
</h3>

</div>


</section>








<section class="card">


<div class="calendar-top">


<button id="prevMonth">
‹
</button>


<h2 id="monthTitle">
</h2>


<button id="nextMonth">
›
</button>


</div>



<div id="calendar">

</div>



</section>









<section class="card">


<h2>
Transactions
</h2>


<div id="transactionList">

<p class="empty">
No transactions yet
</p>


</div>


</section>








<button class="floating-add" id="openForm">

+

</button>









<div class="modal" id="modal">


<div class="modal-box">


<h2>
Add Transaction
</h2>




<input 
id="nameInput"
placeholder="Name"
/>





<input 
id="amountInput"
type="number"
placeholder="Amount"
/>





<select id="typeInput">


<option value="income">
Income
</option>


<option value="expense">
Expense
</option>


</select>





<input 
id="dateInput"
type="date"
/>





<label class="check">

<input 
type="checkbox"
id="repeatInput"
>

Repeat monthly

</label>





<button id="saveTransaction">
Save
</button>


<button id="closeForm">
Cancel
</button>



</div>

</div>







<script src="app.js"></script>


</body>

</html>
